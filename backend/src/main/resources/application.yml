server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: two-track-notebook

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/two_track_notebook?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    db-config:
      logic-delete-field: isDeleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token JWT 配置
sa-token:
  jwt-secret-key: two-track-notebook-secret-key-2026
  token-name: Authorization
  timeout: 2592000       # token 有效期（秒），30天
  is-concurrent: true
  is-share: true
  token-style: jwt-simple

logging:
  level:
    com.twotrack: info
